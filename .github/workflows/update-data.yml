name: Update prices

on:
  schedule:
    # Weekdays after the source dataset's nightly refresh (6pm Chicago)
    - cron: "17 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DuckDB
        run: pip install duckdb==1.1.3 yfinance
      - name: Download source data
        run: |
          mkdir -p data
          curl -sSfL -o data/prices.parquet https://github.com/Johnbrick123/sp500-data/releases/download/data/prices.parquet
          curl -sSfL -o data/membership_intervals.parquet https://github.com/Johnbrick123/sp500-data/releases/download/data/membership_intervals.parquet
          curl -sSfL -o data/constituents.csv https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv
      - name: Build data.json
        run: python scripts/build_data.py
      - name: Build weekly.json
        run: python scripts/build_weekly.py
      - name: Build ohlc.json
        run: python scripts/build_ohlc.py
      - name: Commit if changed
        run: |
          git add data.json weekly.json ohlc.json
          if git diff --cached --quiet; then echo "No new prices"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update prices to $(python -c "import json;print(json.load(open('data.json'))['asOf'])")"
          git push
